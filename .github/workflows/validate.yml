name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript tests
        run: npm test
      - name: Validate source metadata
        run: python3 scripts/validate_plugin.py .
      - name: Package OutSystems Resource
        run: |
          mkdir -p dist
          python3 scripts/package_outsystems.py . --output dist/cordova-plugin-m-document-scanner.zip
      - name: Validate packaged Resource
        run: python3 scripts/validate_plugin.py dist/cordova-plugin-m-document-scanner.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cordova-plugin-m-document-scanner
          path: dist/cordova-plugin-m-document-scanner.zip
          if-no-files-found: error
